name: bun install --frozen-lockfile with retry
description: Run bun install --frozen-lockfile with retries for transient registry/network failures.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        max_attempts=3
        delay_seconds=20

        for attempt in $(seq 1 "$max_attempts"); do
          if [ "$attempt" -gt 1 ]; then
            echo "bun install --frozen-lockfile attempt $attempt/$max_attempts after transient failure"
          fi

          if bun install --frozen-lockfile; then
            exit 0
          fi

          exit_code=$?
          if [ "$attempt" -eq "$max_attempts" ]; then
            exit "$exit_code"
          fi

          sleep "$delay_seconds"
          delay_seconds=$((delay_seconds * 2))
        done
